[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valohai-cli"
dynamic = ["version"]
description = "Command line client for Valohai"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Valohai", email = "hait@valohai.com" },
]
dependencies = [
    "click>=8.2,<9",
    "gitignorant>=0.4.0",
    "requests-toolbelt>=0.7.1",
    "requests>=2.0.0",
    "valohai-utils>=0.5.0",
    "valohai-yaml>=0.51.0",
]

[project.optional-dependencies]
test = [
    "pytest-cov>=4.0",
    "pytest>=7.0",
    "requests-mock~=1.10",
]

[project.scripts]
vh = "valohai_cli.cli:cli"

[project.urls]
Homepage = "https://github.com/valohai/valohai-cli"

[tool.hatch.version]
path = "valohai_cli/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/valohai_cli",
]

[tool.mypy]
exclude = ".*test.*"

[[tool.mypy.overrides]]
module = "valohai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests_toolbelt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests_mock.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = [".git", ".tox"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 110
preview = true

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
ignore = [
    "E501",
    "B904",
    "B905",
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "SIM105", # Use `contextlib.suppress(TypeError)` instead of try-except-pass
]
select = [
    "ARG",
    "ANN", # annotations
    "B", # bugbear
    "C", # complexity & comprehensions
    "COM812",  # trailing comma
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "SIM", # simplify
    "UP", # pyupgrade
    "W", # pycodestyle
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "ANN"]
