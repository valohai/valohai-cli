[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valohai-cli"
dynamic = ["version"]
description = "Command line client for Valohai"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Valohai", email = "hait@valohai.com" },
]
dependencies = [
    "click>=8.2,<9",
    "gitignorant>=0.4.0",
    "requests-toolbelt>=0.7.1",
    "requests>=2.0.0",
    "valohai-utils>=0.5.0",
    "valohai-yaml>=0.51.0",
]

[project.optional-dependencies]
test = [
    "pytest-cov>=4.0",
    "pytest>=7.0",
    "requests-mock~=1.10",
]

[project.scripts]
vh = "valohai_cli.cli:cli"

[project.urls]
Homepage = "https://github.com/valohai/valohai-cli"

[tool.hatch.version]
path = "valohai_cli/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/valohai_cli",
]

[tool.mypy]
exclude = ".*test.*"

[[tool.mypy.overrides]]
module = "valohai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests_toolbelt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests_mock.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = [".git", ".tox"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 110
preview = true

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
ignore = [
    "E501",
    "B904",
    "B905",
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "SIM105", # Use `contextlib.suppress(TypeError)` instead of try-except-pass
    "FURB101", # `open` and `read` should be replaced by `Path(...).read_text()`
    "FURB103", # `open` and `write` should be replaced by `Path(...).write_text()`
    "PERF203", # `try`-`except` within a loop incurs performance overhead (not since 3.11)
    "PLW0717", # Too many statements in `try` clause
    "PLW1514", # `open` in text mode without explicit `encoding` argument (TODO: fix separately)
    "PLW2901", # `for` loop variable overwritten by assignment target
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "RUF067", # `__init__` module should only contain docstrings and re-exports
    "RUF105", # `noqa` comment used instead of `ruff: ignore`
    "RUF201", # Rule code used instead of name in config
]
select = [
    "ARG",
    "ANN", # annotations
    "B", # bugbear
    "C", # complexity & comprehensions
    "COM812",  # trailing comma
    "E", # pycodestyle
    "F", # pyflakes
    "FURB", # refurb
    "I", # isort
    "ISC", # implicit string concatenation
    "LOG", # logging
    "PERF", # perflint
    "PIE", # flake8-pie
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "RUF", # ruff-specific
    "SIM", # simplify
    "T10", # debugger
    "UP", # pyupgrade
    "W", # pycodestyle
    "YTT", # sys.version misuse
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ARG",
    "ANN",
    "RUF069", # Float equality; tests compare exact values round-tripped through JSON
]
